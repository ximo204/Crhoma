<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80" role="img" aria-label="CODEAPA — Control de Diabetes en Atención Primaria de Andalucía">
  <defs>
    <linearGradient id="gradSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Símbolo: escudo con línea de pulso y gota de glucosa -->
  <g transform="translate(10, 8)" filter="url(#shadow)">
    <path d="M32 0 C48 0 60 6 64 16 C64 42 46 58 32 64 C18 58 0 42 0 16 C4 6 16 0 32 0 Z" fill="url(#gradSky)" />
    <path d="M32 4 C46 4 56 9 60 18 C60 40 44 54 32 60 Z" fill="white" opacity="0.1" />
    <path d="M12 32 L22 32 L27 22 L33 44 L39 26 L44 35 L47 32 L52 32" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="47" cy="18" r="4.5" fill="#34d399" />
  </g>

  <!-- Nombre y lema (CO-DE-A-P-A: COntrol de DiabEtes en Atención Primaria de Andalucía) -->
  <g transform="translate(86, 22)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="0" y="16" font-size="28" font-weight="900" letter-spacing="1.5" fill="#0f172a">
      CODE<tspan fill="#0284c7">APA</tspan>
    </text>
    <text x="1" y="31" font-size="7.6" font-weight="700" letter-spacing="0.25" fill="#64748b">CONTROL DE DIABETES EN</text>
    <text x="1" y="41" font-size="7.6" font-weight="700" letter-spacing="0.25" fill="#64748b">ATENCIÓN PRIMARIA DE ANDALUCÍA</text>
  </g>
</svg>
