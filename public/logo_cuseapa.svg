<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80" role="img" aria-label="CUSEAPA — Cuidado y Seguimiento de Heridas en Atención Primaria de Andalucía">
  <defs>
    <linearGradient id="gradEmeraldCuseapa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadowCuseapa" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Símbolo: el mismo escudo que CODEAPA, en verde, con un apósito adhesivo -->
  <g transform="translate(10, 8)" filter="url(#shadowCuseapa)">
    <path d="M32 0 C48 0 60 6 64 16 C64 42 46 58 32 64 C18 58 0 42 0 16 C4 6 16 0 32 0 Z" fill="url(#gradEmeraldCuseapa)" />
    <path d="M32 4 C46 4 56 9 60 18 C60 40 44 54 32 60 Z" fill="white" opacity="0.1" />
    <!-- Apósito en diagonal: tira blanca con almohadilla central -->
    <g transform="rotate(45 31 33)">
      <rect x="11" y="24.5" width="42" height="13" rx="6.5" fill="#ffffff" />
      <rect x="25.5" y="24.5" width="13" height="13" fill="#a7f3d0" />
      <circle cx="16.5" cy="28.5" r="1.1" fill="#6ee7b7" />
      <circle cx="16.5" cy="33.5" r="1.1" fill="#6ee7b7" />
      <circle cx="47.5" cy="28.5" r="1.1" fill="#6ee7b7" />
      <circle cx="47.5" cy="33.5" r="1.1" fill="#6ee7b7" />
    </g>
    <!-- Punto en el azul de CODEAPA: los dos módulos comparten base (CRHOMA) -->
    <circle cx="47" cy="18" r="4.5" fill="#38bdf8" />
  </g>

  <!-- Nombre y lema (CU-SE-A-P-A: CUidado y SEguimiento de heridas en Atención Primaria de Andalucía) -->
  <g transform="translate(86, 22)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="0" y="16" font-size="28" font-weight="900" letter-spacing="1.5" fill="#0f172a">
      CUSE<tspan fill="#059669">APA</tspan>
    </text>
    <text x="1" y="31" font-size="7.6" font-weight="700" letter-spacing="0.25" fill="#64748b">CUIDADO Y SEGUIMIENTO DE HERIDAS</text>
    <text x="1" y="41" font-size="7.6" font-weight="700" letter-spacing="0.25" fill="#64748b">EN ATENCIÓN PRIMARIA DE ANDALUCÍA</text>
  </g>
</svg>
